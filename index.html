<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>患者案内システム</title>
    <!-- PWA（ホーム画面に追加して全画面アプリとして使うための設定） -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="患者案内">
    
    
    <style>
        /* CSS リセットと基本設定 */
        *, ::before, ::after {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
            border-color: #e5e7eb;
        }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: 'Inter', sans-serif; }
        body { margin: 0; line-height: inherit; }
        h1, h2, h3, h4, p { margin: 0; padding: 0; }
        button { cursor: pointer; background-color: transparent; border: none; padding: 0; }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        body {
            font-family: 'Inter', sans-serif;
            font-size: 1rem; 
            background-color: #eff6ff;
            color: #1f2937;
            overflow: auto; /* 小さい画面でリセットボタン等が隠れないように */
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation; /* ダブルタップでの意図しない拡大を防ぐ */ 
        }
        .control-button {
            transition: transform 150ms ease-in-out, background-color 150ms, box-shadow 150ms;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .control-button:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 20px -3px rgba(0, 0, 0, 0.1), 0 6px 6px -2px rgba(0, 0, 0, 0.04);
        }
        .control-button:active {
            transform: scale(0.98);
        }
        .control-button:disabled {
            transform: none !important;
            box-shadow: none !important;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .app-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 2rem;
            width: 100%;
            max-width: 100rem;
            padding: 1rem;
            flex-wrap: nowrap;
        }
        .main-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex-grow: 1;
            flex-shrink: 1;
            min-width: 600px;
            /* グラフを外したので、番号パネルが画面の高さいっぱいに広がる */
            height: calc(100vh - 4rem);
            height: calc(100dvh - 4rem);
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 2rem;
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        .grid-layout > section { min-height: 0; }
        /* 各パネルの中身（ボタン＋番号）を縦いっぱいに使う */
        .panel-inner {
            flex-grow: 1;
            width: 100%;
            min-height: 0;
        }
        /* 番号の表示枠。空いた高さを全部使う */
        .number-box {
            flex: 1 1 auto;
            min-height: 0;
        }
        @media (min-width: 1024px) {
            .grid-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .number-text-lg { 
            font-size: clamp(8rem, 46vh, 30rem); 
            line-height: 1; 
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .admission-text-lg { 
            font-size: clamp(6rem, 33vh, 22rem); 
            line-height: 1; 
            font-weight: 900;
            letter-spacing: -0.05em;
            white-space: nowrap; 
            transform: scaleX(0.75); 
            display: inline-block; 
        }
        .finished-numbers-panel {
            width: 320px; 
            flex-shrink: 0;
            padding: 1.5rem;
            background-color: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            border: 1px solid #dbeafe;
            height: calc(100vh - 4rem);
            height: calc(100dvh - 4rem);
            display: flex;
            flex-direction: column;
        }
        .average-time-container {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: #f3f4f6;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .average-time-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4b5563;
        }
        .average-time-value {
            font-size: 2.25rem;
            font-weight: 800;
            color: #1e40af;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-top: 0.25rem;
        }
        .finished-numbers-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .finished-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #eff6ff;
            padding: 0.375rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #dbeafe;
        }
        .finished-number-item, .finished-admission-item {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }
        .finished-number-item {
            background-color: #60a5fa;
            font-size: 1.125rem;
        }
        .finished-admission-item {
            background-color: #ef4444;
            font-size: 1.875rem;
            line-height: 1;
        }
        .finished-time-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4b5563;
            font-variant-numeric: tabular-nums;
        }
        .fixed { position: fixed; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .bg-black { background-color: #000; }
        .bg-opacity-50 { background-color: rgba(0, 0, 0, 0.5); }
        .gap-4 { gap: 1rem; }
        .bg-blue-50 { background-color: #eff6ff; }
        .text-gray-800 { color: #1f2937; }
        .min-h-screen { min-height: 100vh; }

        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .p-4 { padding: 1rem; }
        .w-full { width: 100%; }

        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; }

        .my-6 { margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .border { border-width: 1px; }

        .border-t { border-top-width: 1px; }
        .border-gray-200 { border-color: #e5e7eb; }

        .bg-blue-600 { background-color: #2563eb; }
        .border-blue-400 { border-color: #60a5fa; }

<body class="min-h-screen flex flex-col items-center p-4">
    <div id="app" class="w-full flex flex-col items-center">
        <div class="app-container">
            <div class="main-content-wrapper">
                <main class="grid-layout">
                    <section id="section-next" class="flex flex-col items-center justify-center p-6 bg-white border-4 border-blue-200 rounded-3xl shadow-xl">
                        <h2 class="text-4xl md:text-5xl font-bold text-gray-600 mb-6 border-b-2 border-blue-100 pb-2">次の方</h2>
                        <div class="panel-inner flex flex-col items-center max-w-sm">
                            <button id="btn-next-advance" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl mb-4 mt-2 bg-blue-100 text-blue-700 hover:bg-blue-200">
                                <span>進む</span>
                            </button>
                            <div id="next-number-display" class="number-box flex items-center justify-center my-6 w-full rounded-xl bg-blue-50 border border-blue-200 text-blue-800"></div>
                            <div class="flex gap-4 w-full mb-4">
                                <button id="btn-next-back" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl bg-blue-100 text-blue-700 hover:bg-blue-200">
                                     <span>戻る</span>
                                </button>
                                <button id="btn-next-admission" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl bg-red-100 text-red-700 hover:bg-red-200">
                                   <span id="next-admission-text">入院</span>
                                </button>
                            </div>
                        </div>
                    </section>
                    <section id="section-current" class="flex flex-col items-center justify-center p-6 bg-blue-600 text-white rounded-3xl shadow-xl">
                        <h2 class="text-4xl md:text-5xl font-bold mb-6 border-b-2 border-blue-400 pb-2">治療中</h2>
                        <div class="panel-inner flex flex-col items-center max-w-sm">
                            <button id="btn-call-next" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl mb-4 mt-2 bg-blue-500 text-white hover:bg-blue-400">
                                <span>次を呼出</span>
                            </button>
                            <div id="current-number-display" class="number-box flex items-center justify-center my-6 w-full rounded-xl bg-blue-700 border border-blue-400 text-yellow-300"></div>
                            <div class="flex gap-4 w-full mb-4">
                                <button id="btn-go-previous" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl bg-blue-500 text-white hover:bg-blue-400">
                                    <span>前を呼出</span>
                                </button>
                                <button id="btn-current-admission" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl bg-red-800 text-white hover:bg-red-900">
                                   <span id="current-admission-text">入院</span>
                                </button>
                                <button id="btn-finish-current" class="control-button w-full py-2 text-lg font-bold shadow-md rounded-xl bg-blue-800 text-white hover:bg-blue-900">
                                   <span>終了</span>
                                </button>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
            <aside id="finished-numbers-panel" class="finished-numbers-panel">
                <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding-right: 0.5rem; margin-right: -0.5rem;">
                    <h3 class="text-2xl font-bold text-gray-600 text-center">終了した番号</h3>
                    <div class="average-time-container">
                        <h4 class="average-time-title">一人当たりの目安 (分)</h4>
                        <p id="average-time-display" class="average-time-value">--</p>
                    </div>
                    <div id="finished-numbers-list" class="finished-numbers-list"></div>
                </div>
                <div class="w-full border-t border-gray-200 pt-4 mt-auto">
                    <button id="btn-reset" class="control-button w-full py-3 text-lg font-bold shadow-lg rounded-xl bg-yellow-500 text-white hover:bg-yellow-600">
                       <span>リセット</span>
                    </button>
                </div>
            </aside>
        </div>
    </div>
    
    <div id="reset-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style="display: none;">
        <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">確認</h3>
            <p class="text-lg text-gray-600 mb-8">本当にすべてのデータをリセットしますか？</p>
            <div class="flex justify-center gap-4">
                <button id="btn-confirm-reset" class="control-button py-3 px-8 text-lg font-bold rounded-xl bg-red-500 text-white hover:bg-red-600">はい</button>
                <button id="btn-cancel-reset" class="control-button py-3 px-8 text-lg font-bold rounded-xl bg-gray-300 text-gray-800 hover:bg-gray-400">いいえ</button>
            </div>
        </div>
    </div>
    <button id="btn-play-audio" class="control-button fixed left-4 py-1 px-2 text-xs font-bold shadow-md rounded-lg bg-yellow-500 text-white hover:bg-yellow-600 z-50 flex items-center" style="bottom: 3rem;">
        <span>音声再生</span>
    </button>

        <span>１つ戻す</span>
    </button>

        // 端末を開きっぱなしにして翌朝復帰したときも、日またぎを検知して初期化する
        let activeBusinessDate = getBusinessDate();
        const checkDayRollover = () => {
            if (getBusinessDate() !== activeBusinessDate) window.location.reload();
        };
        document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayRollover(); });
        setInterval(checkDayRollover, 60 * 1000);

        window.onload = () => {
            loadState();
            activeBusinessDate = getBusinessDate();
            updateDisplay();
        };

        // Service Worker（オフライン動作用）。file:// で直接開いた場合は登録しない
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Workerの登録に失敗しました:', err));
            });
        }
    </script>
</body>
</html>
